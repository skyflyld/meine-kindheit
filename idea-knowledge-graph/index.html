<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026.05 创业idea知识图谱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e17;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;color:#c8d6e5}
#graph{width:100vw;height:100vh}
#info{position:fixed;top:20px;left:20px;z-index:10}
#info h1{font-size:1.4rem;color:#feca57;margin-bottom:4px}
#info p{font-size:.75rem;color:#8395a7}
#detail{position:fixed;top:50%;right:24px;transform:translateY(-50%);background:rgba(15,20,35,.94);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:18px 20px;max-width:300px;display:none;backdrop-filter:blur(12px);z-index:10}
#detail.visible{display:block}
#detail h3{margin-bottom:8px;font-size:1rem}
#detail .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.65rem;margin-bottom:10px}
#detail p{font-size:.78rem;line-height:1.5;color:#a0afbe}
#detail .close{position:absolute;top:8px;right:12px;background:none;border:none;color:#8395a7;cursor:pointer;font-size:1.1rem}
#legend{position:fixed;bottom:20px;left:20px;display:flex;gap:14px;flex-wrap:wrap;z-index:10}
#legend .item{display:flex;align-items:center;gap:6px;font-size:.7rem;color:#8395a7}
#legend .dot{width:10px;height:10px;border-radius:50%}
#controls{position:fixed;bottom:20px;right:20px;display:flex;gap:6px;z-index:10}
#controls button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#8395a7;padding:6px 12px;border-radius:6px;font-size:.7rem;cursor:pointer;transition:all .2s}
#controls button:hover{background:rgba(255,255,255,.12);color:#c8d6e5}
svg{width:100%;height:100%}
.link{stroke-opacity:.25;stroke-width:.8}
.link.highlighted{stroke-opacity:.8;stroke-width:1.8}
.node{cursor:pointer;transition:opacity .2s}
.node.dimmed{opacity:.15}
.node text{font-size:9px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="info"><h1>🧭 创业idea — 信号知识图谱</h1><p>2026.05.08 → 05.12 | 拖拽/滚轮/点击节点</p></div>
<div id="detail"><button class="close" onclick="this.parentElement.classList.remove('visible')">✕</button><h3 id="dn"></h3><span class="tag" id="dt"></span><p id="dd"></p></div>
<div id="legend">
  <div class="item"><span class="dot" style="background:#ff6b6b"></span>AI基建</div>
  <div class="item"><span class="dot" style="background:#48dbfb"></span>Agent生态</div>
  <div class="item"><span class="dot" style="background:#feca57"></span>硬件/机器人</div>
  <div class="item"><span class="dot" style="background:#a29bfe"></span>金融/VC</div>
  <div class="item"><span class="dot" style="background:#00d2d3"></span>安全/隐私</div>
</div>
<div id="controls">
  <button onclick="zoomIn()">🔍+</button>
  <button onclick="zoomOut()">🔍−</button>
  <button onclick="resetView()">↺ 重置</button>
</div>
<div id="graph"></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const data = {
  nodes: [
    // AI基础设施 — #ff6b6b
    {id:"nvidia",group:"ai-infra",name:"Nvidia $40B",radius:16,desc:"2026年前4月$40B AI股权投资。$30B给OpenAI，其余撒遍供应链(Intel/Corning/IREN)。Wedbush称"circular investment"。",date:"5.10"},
    {id:"panthalassa",group:"ai-infra",name:"Panthalassa",radius:11,desc:"漂浮AI数据中心，$140M Series B。波浪能发电+海水散热，PUE 1.15。Ocean-3 2026北太平洋测试。Thiel领投。",date:"5.09"},
    {id:"deepseek",group:"ai-infra",name:"DeepSeek ¥500亿",radius:14,desc:"中国AI史上最大单笔融资，估值$450亿。国家大基金拟领投，梁文锋个人出资¥200亿。",date:"5.10"},
    {id:"anthropic",group:"ai-infra",name:"Anthropic",radius:13,desc:"寻求$500亿融资，估值剑指$9000亿。Claude Dreaming自进化功能，任务完成率×6。年化收入$300亿+。",date:"5.10"},
    {id:"openai",group:"ai-infra",name:"OpenAI",radius:12,desc:"GPT-5.5-Cyber安全模型。Atlas浏览器Agent Mode。拟将ChatGPT+Codex+Atlas合并为桌面超级应用。",date:"5.08"},
    {id:"huawei",group:"ai-infra",name:"华为芯片",radius:10,desc:"芯片实验室首登新闻联播，任正非出镜。AI芯片营收2026预计$12B(+60%)。Nvidia中国份额95%→55%。",date:"5.12"},
    {id:"quantum",group:"ai-infra",name:"量子计算三国杀",radius:9,desc:"本源悟空-180(中国180比特)+Quantum Motion $1.6亿硅基量子+QuantWare建最大量子晶圆厂。",date:"5.10"},
    {id:"tsmc",group:"ai-infra",name:"TSMC A16",radius:8,desc:"1.6nm年底量产，背侧供电。比2nm快10%/省电20%。Nvidia Feynman或为首发客户。",date:"5.08"},
    {id:"coder",group:"ai-infra",name:"Coder Agents",radius:7,desc:"企业自托管AI编码基础设施，模型无关，代码不出墙。解耦agent工具与模型提供商。",date:"5.10"},

    // Agent生态 — #48dbfb
    {id:"mcp",group:"agent",name:"MCP协议",radius:13,desc:"Model Context Protocol。164M月下载(2026.04)。Linux Foundation下Agentic AI Foundation 150成员。Agent时代的USB-C。",date:"5.10"},
    {id:"yc-rfs",group:"agent",name:"YC:给Agent做软件",radius:14,desc:"Aaron Epstein:当所有人建Agent，更大机会是建Agent依赖的软件。API/MCP/CLI优先，UI其次。Headless CRM/一切。",date:"5.10"},
    {id:"circle",group:"agent",name:"Circle纳米支付",radius:12,desc:"AI Agent间百万分之一美分粒度支付框架。Agent经济支付层开始成形。与a16z $22B Agent经济押注共振。",date:"5.12"},
    {id:"dreaming",group:"agent",name:"Claude Dreaming",radius:11,desc:"Agent离线复盘历史会话，提取模式、合并记忆、自我纠错。任务完成率暴涨6倍。AI从工具→自主系统。",date:"5.10"},
    {id:"atlas",group:"agent",name:"Atlas浏览器",radius:10,desc:"OpenAI AI浏览器，Agent Mode自动跨标签比价下单。OWL架构Chromium装隔离沙箱。macOS/Windows。",date:"5.09"},
    {id:"gemini-platform",group:"agent",name:"Google Gemini EP",radius:9,desc:"Gemini Enterprise Agent Platform。Agent Studio+ADK+Model Garden(200+模型)+Agent Gateway+A2A协议。",date:"5.10"},
    {id:"ibm-watsonx",group:"agent",name:"IBM watsonx",radius:8,desc:"IBM Think 2026官宣Agentic Era。watsonx Orchestrate多Agent编排。全线产品注入Agent能力。",date:"5.10"},
    {id:"deepseek-tui",group:"agent",name:"DeepSeek-TUI",radius:9,desc:"Rust终端AI编程助手。两周23K+ Star登顶GitHub。成本Claude Code 1/10。开发者疯了似的需求。",date:"5.11"},
    {id:"saas-aaas",group:"agent",name:"SaaS→AaaS",radius:8,desc:"传统SaaS:"人+软件=结果"。AaaS:"软件=结果"。App Store单季557K新应用(+84%)。Airbnb AI写60%代码。",date:"5.10"},

    // 硬件/机器人 — #feca57
    {id:"optimus",group:"hardware",name:"Optimus Gen3量产",radius:15,desc:"Q2 2026量产，Fremont年产百万台。$20K-$30K。已部署1000+台，847工厂23国。手22自由度。2026 iPhone时刻。",date:"5.10"},
    {id:"embodied",group:"hardware",name:"具身智能独角兽群",radius:12,desc:"千寻智能/自变量/智平方/星海图4家同步晋升百亿估值。RoboScience ¥10亿A轮。维他动力Pre-A ¥5亿。",date:"5.11"},
    {id:"bci",group:"hardware",name:"脑机接口",radius:10,desc:"博睿康全球首张脑机接口医疗器械注册证。7例人体植入。意念弹奏《茉莉花》。反超Neuralink。",date:"5.10"},
    {id:"nvidia-gpu",group:"hardware",name:"Nvidia GPU断供游戏",radius:9,desc:"RTX 50 Super取消，RTX 60延期。AI吃光所有HBM。游戏玩家2026买不到新显卡。",date:"5.10"},

    // 金融/VC — #a29bfe
    {id:"a16z-crypto",group:"finance",name:"a16z Crypto $22B",radius:12,desc:"第五期基金$22B关闭。聚焦稳定币/链上金融/AI代理经济。累计加密基金$98B。与Haun $10B合计$32B。",date:"5.10"},
    {id:"kimi",group:"finance",name:"Kimi $20亿",radius:10,desc:"月之暗面D轮$20亿，估值$200亿。美团龙珠领投，中国移动/CPE源峰跟投。累计融资¥376亿。",date:"5.10"},
    {id:"jump",group:"finance",name:"阶跃星辰$25亿",radius:9,desc:"Pre-IPO $25亿，拆红筹冲刺港股。华勤/中兴/豪威产业资本入局。目标估值$100亿。",date:"5.10"},
    {id:"vc-q1",group:"finance",name:"Q1全球VC $3000亿",radius:11,desc:"Crunchbase数据创纪录，同比+150%。AI占比过半。Q1全球$10亿+交易数量史上最多。95家新独角兽(60家AI)。",date:"5.09"},

    // 安全/隐私 — #00d2d3
    {id:"chrome-model",group:"security",name:"Chrome偷装4GB模型",radius:10,desc:"未经用户同意静默下载Gemini Nano(~4GB)，删了自动重装。Windows/Mac/Linux均受影响，已持续约一年。",date:"5.12"},
    {id:"experian",group:"security",name:"Experian预警",radius:9,desc:"2025年40%数据泄露涉及AI工具。预测2026 Agentic AI将成为数据泄露头号原因。",date:"5.12"},
    {id:"agent-audit",group:"security",name:"Agent行为真空",radius:8,desc:"Agent行为不可审计、无安全验证、无合规框架。Salus(YC W26)在做Agent安全验证。裂缝在扩大。",date:"5.12"},
  ],
  links: [
    // Nvidia centrality
    {source:"nvidia",target:"openai",label:"$30B投资",strength:"primary"},
    {source:"nvidia",target:"panthalassa",label:"算力饥渴"},
    {source:"nvidia",target:"tsmc",label:"芯片代工"},
    {source:"nvidia",target:"nvidia-gpu",label:"HBM挤占"},

    // Agent生态互联
    {source:"mcp",target:"yc-rfs",label:"协议标准",strength:"primary"},
    {source:"mcp",target:"deepseek-tui",label:"AI编程"},
    {source:"mcp",target:"gemini-platform",label:"企业集成"},
    {source:"dreaming",target:"anthropic",label:"核心能力"},
    {source:"atlas",target:"openai",label:"浏览器"},
    {source:"circle",target:"a16z-crypto",label:"Agent支付押注"},
    {source:"circle",target:"mcp",label:"Agent基础设施"},
    {source:"gemini-platform",target:"ibm-watsonx",label:"企业Agent竞赛"},
    {source:"saas-aaas",target:"yc-rfs",label:"范式转移"},

    // Hardware → AI
    {source:"optimus",target:"embodied",label:"具身智能爆发",strength:"primary"},
    {source:"optimus",target:"nvidia",label:"算力需求"},
    {source:"embodied",target:"vc-q1",label:"资本重仓"},
    {source:"bci",target:"optimus",label:"人机融合"},

    // Finance flows
    {source:"a16z-crypto",target:"circle",label:"Agent经济",strength:"primary"},
    {source:"kimi",target:"deepseek",label:"中国大模型竞赛"},
    {source:"jump",target:"kimi",label:"港股冲刺"},
    {source:"vc-q1",target:"a16z-crypto",label:"VC超级周期"},
    {source:"anthropic",target:"vc-q1",label:"$500亿融资"},
    {source:"deepseek",target:"vc-q1",label:"¥500亿融资"},

    // Security cross-cutting
    {source:"chrome-model",target:"experian",label:"隐私塌方",strength:"primary"},
    {source:"chrome-model",target:"agent-audit",label:"治理真空"},
    {source:"experian",target:"agent-audit",label:"合规需求"},
    {source:"agent-audit",target:"yc-rfs",label:"创业机会"},

    // Cross-domain signals
    {source:"huawei",target:"nvidia",label:"中美芯片竞争"},
    {source:"huawei",target:"deepseek",label:"国产AI生态"},
    {source:"quantum",target:"tsmc",label:"下一代算力"},
    {source:"coder",target:"deepseek-tui",label:"自托管趋势"},
    {source:"panthalassa",target:"nvidia-gpu",label:"能源约束驱动"},
  ]
};

const W=window.innerWidth, H=window.innerHeight;
const color=d3.scaleOrdinal()
  .domain(["ai-infra","agent","hardware","finance","security"])
  .range(["#ff6b6b","#48dbfb","#feca57","#a29bfe","#00d2d3"]);

const svg=d3.select("#graph").append("svg").attr("viewBox",[0,0,W,H]);
const g=svg.append("g");

const sim=d3.forceSimulation(data.nodes)
  .force("link",d3.forceLink(data.links).id(d=>d.id).distance(d=>d.strength==="primary"?100:140))
  .force("charge",d3.forceManyBody().strength(-300))
  .force("center",d3.forceCenter(W/2,H/2))
  .force("collision",d3.forceCollide().radius(d=>d.radius+4));

const link=g.append("g").selectAll("line").data(data.links).join("line")
  .attr("class","link").attr("stroke","#2d3436");

const node=g.append("g").selectAll("g").data(data.nodes).join("g").attr("class","node")
  .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

node.append("circle").attr("r",d=>d.radius).attr("fill",d=>color(d.group))
  .attr("stroke","#0a0e17").attr("stroke-width",2)
  .on("mouseenter",function(e,d){
    d3.select(this).attr("stroke","#fff").attr("stroke-width",3);
    document.getElementById("dn").textContent=d.name;
    document.getElementById("dt").textContent=d.date;
    document.getElementById("dt").style.background=color(d.group);
    document.getElementById("dt").style.color="#fff";
    document.getElementById("dd").textContent=d.desc;
    document.getElementById("detail").classList.add("visible");
  })
  .on("mouseleave",function(){d3.select(this).attr("stroke","#0a0e17").attr("stroke-width",2)})
  .on("click",function(e,d){
    d3.selectAll(".node").classed("dimmed",true);
    d3.select(this.parentNode).classed("dimmed",false);
    d.fx=W/2;d.fy=H/2;
    sim.alpha(.5).restart();
    setTimeout(()=>{d.fx=null;d.fy=null;},2000);
  });

node.append("text").text(d=>d.name).attr("dy","-1.1em").attr("text-anchor","middle")
  .attr("fill","#c8d6e5");

sim.on("tick",()=>{
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
    .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform",d=>`translate(${d.x},${d.y})`);
});

const zoom=d3.zoom().scaleExtent([.3,4]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom);
function zoomIn(){svg.transition().duration(300).call(zoom.scaleBy,1.4)}
function zoomOut(){svg.transition().duration(300).call(zoom.scaleBy,.7)}
function resetView(){svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity);d3.selectAll(".node").classed("dimmed",false)}
</script>
</body>
</html>
